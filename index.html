<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAD Word Quest</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main id="game-app">

    <section id="start-screen" class="screen">
      <h1 id="game-title">GAD Word Quest</h1>
      <p id="game-instructions">
        Look at the pictures, guess the word they have in common,
        and type your answer before time runs out.
      </p>
      <button type="button" id="start-button">Start Game</button>
    </section>

    <section id="game-screen" class="screen" hidden>

      <header id="game-header">
        <p id="question-info">Question: <span id="question-number"></span></p>
        <p id="timer-info">Time: <span id="timer-display"></span></p>
      </header>

      <div id="timer-progress-container">
        <div id="timer-progress-bar"></div>
      </div>

      <div id="picture-container"></div>

      <div id="answer-slots"></div>

      <button type="button" id="submit-button">Submit</button>

      <p id="feedback-message" aria-live="polite">
        <span id="feedback-header"></span>
        <span id="feedback-description"></span>
      </p>

    </section>

    <section id="result-screen" class="screen" hidden>
      <h2 id="result-message"></h2>
      <p>Correct answer: <span id="result-answer"></span></p>
      <p>Prize tier: <span id="result-prize"></span></p>
      <button type="button" id="play-again-button">Play Again</button>
    </section>

  </main>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog">
      <h2 id="modal-title">Timer Expired!</h2>
      <p id="modal-message">Good luck on the next round!</p>
      <div id="modal-timer-container" class="timer-container" hidden>
        <span class="timer-title">Next round starts in</span>
        <div class="timer-box">
          <span id="modal-countdown-number">3</span>
        </div>
      </div>
      <button id="modal-button" hidden>Continue</button>
    </div>
  </div>


  <script src="js/main.js" defer></script>
</body>

</html>
