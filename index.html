<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAD Word Quest</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main id="game-app">

    <section id="start-screen" class="screen">
      <h1 id="game-title">4 pics 1 GAD</h1>
      <p id="game-instructions">
        Look at the pictures, guess the word they have in common,
        and type your answer before time runs out.
      </p>

      <div class="mode-selection">
        <button type="button" id="start-normal-btn" class="mode-btn">Normal Mode</button>
        <button type="button" id="start-hard-btn" class="mode-btn secondary">Progressive Mode</button>
      </div>

      <button type="button" id="music-toggle" class="music-toggle" hidden>Music: On</button>
    </section>

    <section id="game-screen" class="screen" hidden>

      <header id="game-header">
        <p id="timer-info">Time: <span id="timer-display"></span></p>
      </header>

      <div id="timer-progress-container">
        <div id="timer-progress-bar"></div>
      </div>

      <div id="picture-container"></div>

      <div id="answer-slots"></div>

      <div id="letter-bank"></div>

      <button type="button" id="submit-button">Submit</button>

      <p id="feedback-message" aria-live="polite">
        <span id="feedback-header"></span>
        <span id="feedback-description"></span>
      </p>

    </section>

    <section id="result-screen" class="screen" hidden>
      <div class="result-header">
        <div class="result-icon">
          <!-- Insert image or icon -->
        </div>

        <h2 id="result-title"></h2>
        <p id="result-description"></p>
      </div>

      <div class="prize-card">
        <p id="prize-label"></p>
        <h3 id="result-prize"></h3>
        <span id="result-stage"></span>
      </div>

      <div class="result-stats">
        <div class="stat-item">
          <span class="stat-label">Total Attempts</span>
          <strong id="result-attempts"></strong>
        </div>

        <div class="stat-item">
          <span class="stat-label">Incorrect Guesses</span>
          <strong id="result-mistakes"></strong>
        </div>
      </div>

      <button type="button" id="play-again-button">Back to Menu</button>
    </section>

  </main>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog">
      <h2 id="modal-title"></h2>
      <p id="modal-message"></p>

      <div id="modal-trivia" class="modal-trivia" hidden>
        <h3 class="modal-trivia-heading">Meaning</h3>
        <p id="modal-trivia-text"></p>
      </div>

      <div id="modal-timer-container" class="timer-container" hidden>
        <span class="timer-title">Next round starts in</span>
        <div class="timer-box">
          <span id="modal-countdown-number"></span>
        </div>
      </div>
      <button id="modal-button" hidden></button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
